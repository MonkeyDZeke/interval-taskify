# ==============================================================================
# DYNAMIC TASK SYSTEM CONFIGURATION & TECHNICAL SPECIFICATION
# Architecture: Relative Urgency Leaderboard & Cognitive Capacity Tracker
# ==============================================================================

system_physics:
  # ----------------------------------------------------------------------------
  # TIME NORMALIZATION
  # Real-world meaning: Scale invariance. Ensures a task 1 day late on a 3-day
  # schedule feels mathematically equivalent to a task 1 week late on a 3-week schedule.
  # ----------------------------------------------------------------------------
  time_variable: "x"
  formula_x: "delta_t / T"
  variables:
    delta_t:
      unit: "days"
      description: "Elapsed wall-clock time since last task completion or activation timestamp."
    T:
      unit: "days"
      description: "Target urgency interval (user-defined per task or dynamically adjusted)."

  # ----------------------------------------------------------------------------
  # GLOBAL CURVE PARAMETERS
  # Real-world meaning: Universal physics governing task acceleration across the app.
  # ----------------------------------------------------------------------------
  a:
    value: 10.0
    description: "Logarithmic early-gain curvature factor (0 <= x <= 1)."
    behavior: "Reclaims ~75% of base weight S at half-interval (x = 0.5), strongly rewarding early proactive completions."

  b:
    value: 1.386
    description: "Exponential growth rate factor (x > 1)."
    behavior: "Doubles task weight (2.0 * S) at 50% overdue (x = 1.5) and quadruples weight (4.0 * S) at 100% overdue (x = 2.0)."

  # ----------------------------------------------------------------------------
  # DYNAMIC URGENCY WEIGHT EQUATIONS W(x)
  # Uses S_effective which combines base significance, progress multiplier (R),
  # deferment debuffs, and vacation multipliers.
  # ----------------------------------------------------------------------------
  urgency_weight:
    effective_significance_formula: "S_effective = R * S_deferment_debuff * S_vacation_multiplier"
    logarithmic_phase:
      condition: "0 <= x <= 1"
      equation: "W(x) = S_effective * ( ln(1 + a * x) / ln(1 + a) )"
      behavior: "Smoothly rises from 0 to S_effective. Gain rate slows near x = 1."

    exponential_phase:
      condition: "x > 1"
      equation: "W(x) = S_effective * e^(b * (x - 1))"
      behavior: "Accelerates rapidly past S_effective, forcing long-neglected items to rise."

# ==============================================================================
# TASK PARAMETERS, RECURRENCE & BOUNDARIES
# ==============================================================================

recurrence_and_lifecycle:
  # ----------------------------------------------------------------------------
  # SINGLETON VS RECURRING TASK SPECIFICATION
  # ----------------------------------------------------------------------------
  is_recurring:
    type: "boolean"
    default: true
    description: "Determines task behavior upon 100% completion (accumulated_progress >= 1.0)."
    completion_handler:
      recurring_true:
        action: "Reset urgency anchor timestamp (delta_t = 0), reset accumulated_progress = 0.0 (R = 1.0), and record full completion log."
        target_state: "active"
        description: "Task remains active, clears partial progress, and begins a new urgency cycle."
      recurring_false:
        action: "Mark full completion timestamp, reset accumulated_progress = 0.0, halt urgency clock."
        target_state: "completed"
        description: "Task transitions to terminal completed state permanently."
    capacity_handler:
      recurring_true: "Daily load C_i = E_i / T_i (constant)."
      recurring_false: "Daily load ramps with proximity to due date per domains_and_capacity.once_off_cost_formula, peaking at E_i (daily-task equivalent) when due or overdue."

significance_tiers:
  # ----------------------------------------------------------------------------
  # SIGNIFICANCE (S) - DRIVES LEADERBOARD RANKING ONLY
  # Real-world meaning: Consequence/stakes of ignoring a task.
  # Mathematical bound: Bound typically to exponential factor b so a Tier 4 task
  # at epoch (x=1) equals a Tier 1 task that is exactly 1 interval overdue (x=2).
  # ----------------------------------------------------------------------------
  step_conversion_rule: "S_4 = S_1 * e^b = 1.0 * 4.0 = 4.0"
  tiers:
    tier_1:
      name: "Low / Routine"
      value: 1.0
      description: "Flexible habits (e.g., casual reading, wiping counters)."
    tier_2:
      name: "Medium / Standard"
      value: 1.6
      description: "Routine household maintenance (e.g., vacuuming, groceries)."
    tier_3:
      name: "High / Important"
      value: 2.5
      description: "Key relational or operational items (e.g., calling mom, bill prep)."
    tier_4:
      name: "Critical / High-Stakes"
      value: 4.0
      description: "Hard consequence items (e.g., rent payment, car oil change)."

effort_levels:
  # ----------------------------------------------------------------------------
  # EFFORT MULTIPLIER (E) - DRIVES CAPACITY CONSUMPTION ONLY
  # Real-world meaning: Physical/Cognitive friction required to perform the task.
  # Disentangled from Significance (S) to prevent high-stakes easy tasks from
  # artificially exhausting capacity budgets.
  # ----------------------------------------------------------------------------
  presets:
    quick:
      value: 0.5 # Attention Units (AU)
      duration_proxy: "< 5 mins"
      description: "Minimal friction. Low context-switching cost (e.g., take pill, wipe table)."
    standard:
      value: 1.0 # Attention Units (AU)
      duration_proxy: "15-30 mins"
      description: "Moderate focus/energy (e.g., vacuum living room, 20-min phone call)."
    heavy:
      value: 2.5 # Attention Units (AU)
      duration_proxy: "60+ mins"
      description: "High energy or high friction (e.g., deep clean garage, tax prep)."

todo_states:
  default: active
  calculation_eligible_states: [active]
  states:
    active:
      description: "Included in urgency, actionability, capacity, routing, and leaderboard calculations."
    frozen:
      description: "Excluded from calculations and the leaderboard."
      urgency_clock_behavior: "Hold elapsed interval time while frozen."
      on_return_to_active: "Resume from the same elapsed interval position; time spent frozen does not advance urgency."
    hidden:
      description: "Excluded from calculations and the leaderboard."
      urgency_clock_behavior: "Continue advancing as if the todo were active."
      on_return_to_active: "Calculate urgency using the full elapsed time, including time spent hidden."
    paused:
      description: "Excluded from calculations and the leaderboard."
      urgency_clock_behavior: "Do not calculate urgency while paused."
      on_return_to_active: "Reset the urgency anchor to the reactivation time so x = 0; do not record a completion event."
    completed:
      description: "Terminal state for non-recurring singletons (is_recurring: false) after 100% completion."
      urgency_clock_behavior: "Clock stopped permanently. Excluded from urgency, capacity, leaderboard, and routing calculations."
      on_return_to_active: "If un-completed or reactivated manually, reset urgency anchor to current timestamp (delta_t = 0) and progress = 0.0."

# ==============================================================================
# PARTIAL COMPLETION MECHANICS (PROGRESS & EFFORT/SIGNIFICANCE SCALING)
# ==============================================================================

partial_completions:
  description: "Allows logging partial progress P in (0, 100%) to squish a task's priority and capacity footprint without altering the urgency clock or deadline."

  progress_tracking:
    accumulated_progress:
      type: "float"
      range: "0.0 to 1.0"
      default: 0.0
      description: "Cumulative percentage of task completed since last full reset."
      increment_rule: "p_accum_new = min(1.0, p_accum_old + (P / 100.0))"

    remaining_work_multiplier:
      formula: "R = 1.0 - accumulated_progress"
      range: "0.0 < R <= 1.0"
      description: "Linear scaling factor representing remaining effort and significance required."

  dual_scaling_behavior:
    significance_scaling:
      formula: "S_effective = R * S_base"
      behavior: "Immediately reduces urgency weight W(x) proportionally to progress made, dropping the task lower on the leaderboard."

    effort_scaling:
      formula: "E_effective = R * E_base"
      behavior: "Scales active cognitive heaviness continuously. Instantly reduces daily domain maintenance load C_i = E_effective / T_i, freeing Attention Units."

    actionability_ratio_stability:
      formula: "ROI = W(x) / E_effective = (R * S * f(x)) / (R * E) = (S * f(x)) / E"
      behavior: "The effort-to-urgency priority ratio remains mathematically stable regardless of partial progress made."

  system_safeguards:
    urgency_clock_safeguard:
      rule: "Logging partial progress MUST NOT reset or modify urgency_anchor_at (delta_t)."
      rationale: "Prevents partial check-ins from granting an artificial deadline extension."
    completion_timestamp_safeguard:
      rule: "last_completed_at is NOT updated during partial progress check-ins."
      rationale: "Reserves last_completed_at strictly for 100% completion milestones."
    analytics_isolation:
      rule: "Completion log entries specify progress_increment = P / 100.0."
      query_filtering: "History analytics and completion lists filter by progress_increment == 1.0 to isolate full completions."

  full_completion_trigger:
    condition: "accumulated_progress >= 1.0"
    action: "Triggers standard 100% completion lifecycle (resets progress to 0.0, updates last_completed_at, and resets anchor or moves to completed state)."

  comparison_with_deferment:
    matrix:
      intent:
        partial_completion: "Active progress / work expended"
        deferment: "Procrastination / deliberate delay"
      clock_anchor:
        partial_completion: "Untouched (deadlines remain fixed)"
        deferment: "Untouched (deadlines remain fixed)"
      significance_effect:
        partial_completion: "Scaled to R * S_base (stays reduced)"
        deferment: "Debuffed to 0.10 * S_base, decays back up"
      effort_effect:
        partial_completion: "Scaled to R * E_base (frees AU capacity)"
        deferment: "Unchanged (E_base remains fixed)"
      overshoot_penalty:
        partial_completion: "None"
        deferment: "Rebounds up to 1.2x - 1.5x penalty peak"
      ui_indicator:
        partial_completion: "Progress ring / progress bar"
        deferment: "deferment_count badge"

# ==============================================================================
# DEFERMENT MECHANICS (TEMPORARY SIGNIFICANCE DEBUFF & REBOUND)
# ==============================================================================

deferment_mechanics:
  description: "Allows temporary deprioritization of a task by debuffing significance S while tracking lifetime deferment count."
  tracking:
    deferment_count:
      type: "integer"
      default: 0
      description: "Lifetime tally of times this task was deferred. Incremented upon each deferral action."
      ui_visibility: "Displayed prominently on task cards and main dashboard as a procrastination indicator."
      persistence: "Retained permanently across completions; completing a task does NOT reset deferment_count."

  activation_rule:
    action: "User clicks Defer."
    state_changes:
      - "Increment deferment_count by 1 (k = deferment_count)."
      - "Record deferment initiation timestamp t_defer."
      - "Calculate initial debuffed significance: S_effective(0) = 0.10 * S_base."

  dynamic_significance_curve:
    variables:
      delta_t_defer: "Elapsed time since deferment was triggered (t - t_defer)."
      T: "Task urgency interval."
      k: "Current deferment_count value."
      M_k: "Max rebound multiplier formula: M(k) = 1.0 + 0.10 * k (e.g., k=2 -> 1.2x, k=5 -> 1.5x)."

    phases:
      phase_1_recovery:
        condition: "0 <= delta_t_defer <= 0.5 * T"
        formula: "S_effective = S_base * [ 0.10 + 1.80 * (delta_t_defer / T) ]"
        behavior: "Significance starts at 10% of S_base and recovers linearly back to 100% of S_base over half the task interval."

      phase_2_rebound_overshoot:
        condition: "0.5 * T < delta_t_defer <= 1.0 * T"
        formula: "S_effective = S_base * [ 1.0 + 0.20 * k * ((delta_t_defer / T) - 0.5) ]"
        behavior: "Significance continues rising linearly past S_base, overshooting up to max rebound multiplier M(k) * S_base."

      phase_3_terminal_penalty:
        condition: "delta_t_defer > 1.0 * T"
        formula: "S_effective = S_base * M(k)"
        behavior: "Significance remains pegged at penalty peak until task is completed or deferred again."

  completion_interaction:
    behavior: "Completing a task resets S_effective back to standard tier S_base, but deferment_count remains at k."

# ==============================================================================
# WINDOWS OF VIABILITY
# ==============================================================================

viability_windows:
  description: "Restricts task visibility and actionable calculations based on temporal schedules."
  evaluation_rule: "Tasks evaluated outside their viability window dynamically inherit 'hidden' state mechanics."
  urgency_clock_interaction: "Urgency clock continues advancing during non-viable periods."
  supported_window_types:
    day_of_week:
      example: ["saturday", "sunday"]
      description: "Tasks viable only on specific days (e.g., weekend chores)."
    time_of_day:
      example: { start: "09:00", end: "17:00" }
      description: "Tasks restricted to specific business or daylight hours."
    date_range:
      example: { start: "2026-11-01", end: "2026-12-31" }
      description: "Seasonal or calendar-bounded tasks."

  state_routing_logic:
    inside_window: "Todo operates according to its primary state (typically active)."
    outside_window: "Todo is treated as conditionally 'hidden'. Suppressed from leaderboard and capacity allocations until window opens."

# ==============================================================================
# COGNITIVE DOMAINS, CONTEXTS & CAPACITY MODELING
# ==============================================================================

domains_and_capacity:
  # ----------------------------------------------------------------------------
  # ATTENTION UNIT (AU) DEFINITION
  # 1.0 AU = Daily maintenance cost of a Standard Effort (E=1.0) task with a 1-day interval (T=1.0).
  # ----------------------------------------------------------------------------
  cost_formula: "C_i = E_effective / T_i = (R * E_base) / T_i"

  # ----------------------------------------------------------------------------
  # ONCE-OFF TASK LOAD (is_recurring: false)
  # Real-world meaning: A once-off task has no steady maintenance cost; its load
  # ramps up as the due date nears, spreading the work across the remaining days,
  # then holds at its peak once overdue. Peak load equals that of a daily (T = 1)
  # recurring task: an overdue once-off task weighs on capacity exactly as much per
  # day as a daily task of the same effort that is completed every day (E_i AU/day),
  # independent of its own interval T.
  # Proxy: reuses the existing logarithmic urgency ratio W(x) / S_effective, so no
  # new curve or constants are introduced.
  # ----------------------------------------------------------------------------
  once_off_cost_formula:
    applies_to: "Active tasks with is_recurring: false. Recurring tasks keep C_i = E_i / T_i."
    equation: "C_i(x) = E_i * R(x)"
    baseline_load: "E_i AU/day, i.e. E_i / T with T fixed at 1.0 day (the daily-task equivalent). T_i of the once-off task only scales the ramp via x = delta_t / T_i; it does not scale the peak."
    ramp_factor:
      R_x: "R(x) = ln(1 + a * x) / ln(1 + a) for 0 <= x <= 1; R(x) = 1.0 for x > 1"
      relation_to_urgency: "R(x) = W(x) / S_effective while x <= 1. Unlike W(x), R is clamped at 1.0 past the due date instead of growing exponentially."
      behavior: "Starts at 0 when the task is created or activated (x = 0), rises quickly early (~0.75 at x = 0.5), and reaches the daily-equivalent peak load E_i at the due date."
      overdue_behavior: "Load persists at 100% of E_i (R = 1.0, same as a daily task) until the task is completed. Overdue debt is still tracked separately via x > 1.0."
      terminal_behavior: "Completed once-off tasks contribute 0 load (see todo_states.completed)."

  channels:
    executive_mental:
      name: "Mental / Executive"
      science_anchor: "Cowan's Working Memory Limit (4 +/- 1) & Deep Work Daily Cap"
      max_daily_capacity_au: 5.0
      description: "Holds executive function, focus, planning, and decision-making items."

    physical_somatic:
      name: "Physical / Somatic"
      science_anchor: "Central Nervous System Recovery & Routine Habit Ceilings"
      max_daily_capacity_au: 4.0
      description: "Holds physical chores, manual labor, and movement maintenance."

    social_relational:
      name: "Social / Relational"
      science_anchor: "Dunbar's Inner Circle (5 intimate core bonds)"
      max_daily_capacity_au: 3.0
      description: "Holds relationships, check-ins, family, and social maintenance."

  # ----------------------------------------------------------------------------
  # SCIENCE-BACKED BURNOUT & OVERWHELM THRESHOLD
  # Real-world meaning: The point where accumulated overdue task debt triggers
  # executive function fatigue, stress bleedthrough, and systemic burnout.
  # ----------------------------------------------------------------------------
  burnout_overwhelm_threshold:
    science_anchor: "Allostatic Load Theory (McEwen & Stellar) & Ego Depletion in Executive Control (Baumeister)"
    overdue_debt_threshold_ratio: 0.25 # Overdue tasks (x > 1.0) consuming >25% of baseline capacity (3.0 AU)
    capacity_overload_ratio: 1.00     # Active daily load exceeding 100% of baseline capacity (12.0 AU)
    description: "Threshold at which cognitive debt shifts from localized friction to system-wide executive depletion."

  # ----------------------------------------------------------------------------
  # CONTEXT SWITCHER (ENVIRONMENTS)
  # Real-world meaning: Segregates tasks into discrete life spheres (e.g., Work vs. Home vs. Study).
  # ----------------------------------------------------------------------------
  context_switcher:
    contexts: ["work", "home", "study"]
    active_context: "user_selected"
    compartmentalization:
      load_isolation: "Capacity calculations and domain caps apply independently per context during nominal conditions."
      overload_bleedthrough:
        enabled: true
        threshold_ref: "domains_and_capacity.burnout_overwhelm_threshold"
        trigger_condition: "Context Overdue Debt (C_overdue) > (0.25 * L_baseline) OR Context Load (L_active) > L_baseline"
        bleed_factor: 0.35 # Non-linear decay penalty coefficient
        dynamic_capacity_adaptation:
          formula: "L_effective_adjacent = L_baseline_adjacent * (1.0 - bleed_factor * min(1.0, (C_overdue_excess / (0.25 * L_baseline))))"
          mechanics: "When a context crosses the Burnout & Overwhelm Threshold due to heavy overdue backlog (x > 1.0), Allostatic Load causes involuntary cognitive spillover. This dynamically reduces the effective capacity ceiling (L_effective) of adjacent contexts (e.g., Work overwhelm automatically shrinks available daily capacity for Home and Study)."

  system_ceiling:
    total_baseline_au: 12.0
    ui_heatmap_zones:
      green: "0.0 to 8.4 AU (0% - 70%): Sustainable, leaves 30% buffer for surprises."
      yellow: "8.4 to 12.0 AU (70% - 100%): Nominal capacity limit."
      red: "> 12.0 AU (> 100% OR Overdue Debt > 25%): Burnout / Overload Zone. Exceeds Allostatic Threshold and triggers Context Bleedthrough penalties."

# ==============================================================================
# VACATIONS & DYNAMIC CAPACITY MANAGEMENT
# ==============================================================================

vacations_and_capacity:
  description: "Replaces raw capacity throttling with intentional or suggested Vacation profiles that modify task behaviors during reduced availability windows."

  creation_triggers:
    manual_creation:
      description: "Users can create unconstrained, concurrent, or future scheduled Vacations at any time."
    capacity_reduction_trigger:
      description: "Lowering global/domain capacity sliders automatically generates a suggested Vacation profile."
      suggested_profile_action: "Populates a draft Vacation with pre-selected task modifications to fit reduced capacity, which the user can accept, edit, or decline."

  vacation_lifecycle:
    attributes:
      start_time: "Timestamp/Date when vacation modifications take effect."
      end_time: "Optional Timestamp/Date. If omitted, vacation remains active indefinitely until manually ended."
      is_active: "Boolean flag evaluating whether current time falls within [start_time, end_time]."
    termination:
      manual_early_termination: "User can terminate any vacation prior to its scheduled end_time at any time, immediately reverting all task modifications."

  task_modification_rules:
    description: "Each Vacation holds a manifest of task-specific overrides applied while the vacation is active."
    allowed_modifications:
      state_override:
        type: "enum"
        options: [frozen, hidden, paused]
        description: "Temporarily alters task state (e.g., auto-freeze heavy chores)."
      significance_multiplier:
        type: "float"
        default: 1.0
        description: "Scales effective significance during vacation (e.g., 0.5 * S_base for work tasks)."
      effort_override:
        type: "float"
        description: "Temporarily adjusts effort rating during vacation."

  triage_recommendation_engine:
    description: "Used by suggested vacations to bring total active capacity within target limit."
    step_1: "Sort active tasks by Significance (S) ASC, Interval (T) DESC."
    step_2: "Auto-select lowest-stakes tasks for state override (frozen/hidden) until L_active <= L_vacation_target."
    step_3: "Protect Tier 4 and explicitly tagged 'Self-Care/Survival' tasks from modification."

# ==============================================================================
# ROUTING & LEADERBOARD POOLING
# ==============================================================================

leaderboard_routing:
  top_n_selection:
    pool_allocation_strategy: "Dynamic Category Sampling"
    formula: "Category_Share = Category_Load_AU / Total_Active_Load_AU"
    description: "Prevents a flood of overdue daily chores in one category from starving other domains."

  proactive_radar_bucket:
    condition: "x <= 1.0"
    sorting: "W(x) / S_effective DESC"
    description: "Surfaces tasks approaching peak epoch that offer maximum proactive load reduction."
